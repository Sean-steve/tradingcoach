# Only the TRADE OS application. Database/Auth/Storage are external,
# separately managed services. Do not expose PostgreSQL or Redis publicly.
services:
  trade-os:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?required}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?required}
        VITE_ENABLE_GOOGLE_OAUTH: ${VITE_ENABLE_GOOGLE_OAUTH:-false}
    env_file:
      - ../${TRADE_OS_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 8080
    ports:
      - "127.0.0.1:${TRADE_OS_HOST_PORT:-18080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
