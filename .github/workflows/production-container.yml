name: TRADE OS — Production Container Smoke

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone release container (public test configuration only)
        run: |
          docker build -t tradeos:ci \
            --build-arg VITE_SUPABASE_URL=https://example.invalid \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only \
            .
      - name: Run isolated release container with no external credentials
        run: |
          docker run -d --name tradeos-ci -p 127.0.0.1:18080:8080 \
            -e TRADE_OS_RELEASE_SHA="${{ github.sha }}" tradeos:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs tradeos-ci --tail=70 >&2
          exit 1
      - name: Verify liveness, fail-closed database readiness and worker auth
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://127.0.0.1:18080';
          const health=await fetch(base+'/api/health');
          assert.equal(health.status,200);
          assert.equal((await health.json()).status,'ok');
          const ready=await fetch(base+'/api/ready');
          assert.equal(ready.status,503,'No configured DB must not be production ready');
          const worker=await fetch(base+'/api/internal/intelligence');
          assert.equal(worker.status,401,'Worker diagnostics are not public');
          const post=await fetch(base+'/api/internal/intelligence',{method:'POST'});
          assert.equal(post.status,401,'Worker execution requires a service secret');
          console.log('Standalone production container smoke PASS');
          JS
      - name: Stop release container
        if: always()
        run: docker rm -f tradeos-ci || true
